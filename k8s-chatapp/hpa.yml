kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2

metadata:
  name: chatapp-hpa
  namespace: chatapp

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chatapp-deployment
  
  minReplicas: 1
  maxReplicas: 4

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 4
