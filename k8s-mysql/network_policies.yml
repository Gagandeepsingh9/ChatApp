kind: NetworkPolicy
apiVersion: networking.k8s.io/v1

metadata:
  name: mysql-network-policy
  namespace: chatapp
spec:
  podSelector:
    matchLabels:
      app: mysql

  policyTypes:
  - Ingress

  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: chatapp
    ports:
    - protocol: TCP
      port: 3306
      
    
