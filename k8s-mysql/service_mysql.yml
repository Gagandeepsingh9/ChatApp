kind: Service
apiVersion: v1

metadata:
  name: mysql-svc
  namespace: chatapp

spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - port: 3306
      name: mysql-port

#this is a headless service because there is no ip address allocated for the group of pods
#chatapp application pods will reach to these mysql pods directly through the domain names 
